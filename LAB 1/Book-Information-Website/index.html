<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Discover, explore, and review curated book information including The Alchemist, Wings of Fire, and Rich Dad Poor Dad.">
  <title>Book Info Hub - Explore Books, Ratings & Reviews</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation Header -->
  <header class="header">
    <div class="nav-container">
      <a href="index.html" class="logo-group">
        <div class="logo-icon">📚</div>
        <span class="logo-title">BookHub</span>
      </a>

      <div class="nav-controls">
        <button id="filterBookmarksBtn" class="btn-icon" title="View Favorites" aria-label="Favorites">
          ❤️
          <span id="bookmarkCountBadge" class="bookmark-count-badge hidden">0</span>
        </button>
        <button id="themeToggleBtn" class="btn-icon" aria-label="Toggle Theme">🌙</button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    
    <!-- Hero Banner -->
    <section class="hero-section">
      <h1 class="hero-title">Discover Timeless Classics & Bestsellers</h1>
      <p class="hero-subtitle">Explore curated book summaries, pricing, ratings, and reader reviews to find your next great read.</p>
    </section>

    <!-- Interactive Filter & Search Controls -->
    <section class="filter-bar">
      <div class="search-input-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" class="search-input" placeholder="Search by title, author, genre, or keyword..." aria-label="Search books">
      </div>

      <div class="filter-options">
        <div class="genre-pills">
          <button class="pill-btn active" data-genre="All">All Books</button>
          <button class="pill-btn" data-genre="Fiction">Fiction</button>
          <button class="pill-btn" data-genre="Autobiography">Autobiography</button>
          <button class="pill-btn" data-genre="Personal Finance">Personal Finance</button>
        </div>

        <div class="sort-wrapper">
          <label for="sortSelect">Sort by:</label>
          <select id="sortSelect" class="sort-select">
            <option value="default">Featured</option>
            <option value="title">Title (A-Z)</option>
            <option value="price-low">Price: Low to High</option>
            <option value="price-high">Price: High to Low</option>
            <option value="year-desc">Year: Newest First</option>
          </select>
        </div>
      </div>
    </section>

    <!-- Dynamic Books Grid -->
    <section id="booksContainer" class="books-grid">
      <!-- Dynamically populated via script.js -->
    </section>

  </main>

  <!-- Native Quick View Modal -->
  <dialog id="quickViewModal" class="modal"></dialog>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2026 BookHub Information Website. Built for book enthusiasts everywhere.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
