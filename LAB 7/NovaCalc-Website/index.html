<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A modern mathematical calculator with calculation history.">
    <title>NovaCalc | Mathematical Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="orb orb-one" aria-hidden="true"></div>
    <div class="orb orb-two" aria-hidden="true"></div>
    <div class="grid-glow" aria-hidden="true"></div>

    <main class="app-shell">
        <section class="calculator-card" aria-labelledby="calculator-title">
            <div class="brand-row">
                <div class="brand-mark" aria-hidden="true">∑</div>
                <div>
                    <span class="eyebrow">Precision, simplified</span>
                    <div class="brand-name">NOVA / 01</div>
                </div>
                <span class="live-badge"><i aria-hidden="true"></i> Live</span>
            </div>

            <div class="heading">
                <h1 id="calculator-title">Nova<span>Calc</span></h1>
                <p>Make every number count.</p>
            </div>

            <form id="calculator-form">
                <div class="inputs">
                    <div class="input-group">
                        <label for="num1">First number</label>
                        <input type="number" id="num1" name="num1" step="any" placeholder="0" inputmode="decimal" autocomplete="off">
                    </div>
                    <div class="operator-badge" id="operator-display" aria-hidden="true">+</div>
                    <div class="input-group">
                        <label for="num2">Second number</label>
                        <input type="number" id="num2" name="num2" step="any" placeholder="0" inputmode="decimal" autocomplete="off">
                    </div>
                </div>

                <p id="message" class="message" role="alert" aria-live="polite"></p>

                <div class="buttons" aria-label="Mathematical operations">
                    <button type="button" class="operation-button" data-operation="+">
                        <span class="button-symbol">+</span>
                        <span>Addition</span>
                    </button>
                    <button type="button" class="operation-button" data-operation="-">
                        <span class="button-symbol">−</span>
                        <span>Subtraction</span>
                    </button>
                    <button type="button" class="operation-button" data-operation="*">
                        <span class="button-symbol">×</span>
                        <span>Multiply</span>
                    </button>
                    <button type="button" class="operation-button" data-operation="/">
                        <span class="button-symbol">÷</span>
                        <span>Division</span>
                    </button>
                </div>

                <button type="button" class="clear-button" id="clear-button">
                    <span aria-hidden="true">↺</span> Clear calculator
                </button>
            </form>

            <div class="result-panel" id="result" aria-live="polite">
                <div>
                    <span class="result-label">Your result</span>
                    <span class="result-caption">Calculated instantly</span>
                </div>
                <strong id="result-value">—</strong>
            </div>

            <p class="keyboard-hint"><kbd>+</kbd> <kbd>−</kbd> <kbd>×</kbd> <kbd>÷</kbd> to calculate <span>•</span> <kbd>Enter</kbd> to run</p>
        </section>

        <aside class="history-card" aria-labelledby="history-title">
            <div class="history-header">
                <div>
                    <span class="eyebrow">Your activity</span>
                    <h2 id="history-title">Recent calculations</h2>
                </div>
                <span class="history-count" id="history-count">0</span>
            </div>
            <div class="history-list" id="history-list">
                <div class="empty-history" id="empty-history">
                    <span aria-hidden="true">◌</span>
                    <p>Your calculations will appear here.</p>
                </div>
            </div>
            <button type="button" class="clear-history" id="clear-history">Clear history</button>
        </aside>
    </main>

    <script src="script.js"></script>
</body>
</html>
